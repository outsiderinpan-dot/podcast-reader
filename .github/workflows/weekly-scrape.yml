name: weekly-enqueue

# 每周一 08:00 UTC（= 北京时间 16:00）三路并行抓取新单集英文转写 → 写入飞书多维表格「翻译队列」。
# 分 3 组是为了突破单 job Whisper 预算瓶颈（每组 8 个 Whisper 名额 × 3 并行 = 24 集/周总容量）：
#   official       — iHeart 官方字幕充足的节目（极少用 Whisper，跑得飞快）
#   whisper-iheart — iHeart 但无官方字幕的节目（全靠 Whisper）
#   whisper-rss    — RSS 来源节目（无 podcast:transcript，全靠 Whisper）
# 手动触发填了 shows_filter 时，prepare 会把 filter 拆到对应的组并只跑命中的组（仍并行、互不重复）；
# 留空则三路全跑。
#
# 注意：GitHub Actions 的 job 级 if 不能引用 matrix 上下文，故用 prepare 作业动态生成 matrix，
# 而不是在 enqueue 上写 if: matrix.group.name == ...（那样会导致 workflow 解析失败）。
on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:
    inputs:
      max_new:
        description: '每个节目本次最多入队几集'
        required: false
        default: '5'
      whisper_max:
        description: '每组本次最多用 Whisper 转写几集'
        required: false
        default: '8'
      whisper_model:
        description: 'Whisper 模型 tiny/base/small/medium'
        required: false
        default: 'base'
      shows_filter:
        description: '只处理这些 show.slug（逗号分隔）；留空=按三路矩阵全跑'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - name: Compute group matrix
        id: set
        env:
          FILTER: ${{ github.event.inputs.shows_filter || '' }}
        run: |
          node -e '
            const fs = require("fs");
            const filter = (process.env.FILTER || "").trim();
            const ALL = [
              { name: "official", shows: "inside-active,trillions,odd-lots,money-stuff,top-traders-unplugged,invest-like-the-best,capital-allocators,etf-edge,macro-voices,exchanges,swimming-with-allocators" },
              { name: "whisper-iheart", shows: "rational-reminder,the-bid,without-boundaries,behind-the-ticker" },
              { name: "whisper-rss", shows: "the-long-view,etf-prime,alpha-exchange,the-derivative,absolute-return,alternative-fund-insight" }
            ];
            let groups;
            if (!filter) {
              groups = ALL;
            } else {
              const want = filter.split(",").map(s => s.trim()).filter(Boolean);
              groups = ALL
                .map(g => ({ name: g.name, shows: g.shows.split(",").filter(s => want.includes(s)).join(",") }))
                .filter(g => g.shows);
              if (!groups.length) groups = [{ name: "custom", shows: filter }];
            }
            const matrix = JSON.stringify({ group: groups });
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "matrix=" + matrix + "\n");
            console.log("groups:", groups.map(g => g.name + " [" + g.shows + "]").join("  |  "));
          '

  enqueue:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    name: "enqueue (${{ matrix.group.name }})"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/whisper
          key: whisper-model-${{ github.event.inputs.whisper_model || 'base' }}

      - name: Install openai-whisper
        run: pip install -U openai-whisper

      - name: Scrape EN (+Whisper) → push to Feishu queue
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_BITABLE_TOKEN: ${{ secrets.FEISHU_BITABLE_TOKEN }}
          FEISHU_TABLE_ID: ${{ secrets.FEISHU_TABLE_ID }}
          MAX_NEW: ${{ github.event.inputs.max_new || '5' }}
          WHISPER_ENABLED: 'true'
          WHISPER_MODEL: ${{ github.event.inputs.whisper_model || 'base' }}
          WHISPER_MAX_PER_RUN: ${{ github.event.inputs.whisper_max || '8' }}
          SHOWS_FILTER: ${{ matrix.group.shows }}
        run: node scripts/enqueue.mjs
